<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1bRI2snyA3PGc0r2I64X6gx60Gvme-6sdnw18YLNl4fGTHABlWm91xZYLrYir5lLw/exec";

  // Fungsi Ambil Data dengan Pengaman Error
  function loadData() {
    // 1. Muat dari cache lokal terlebih dahulu agar langsung tampil
    var cached = localStorage.getItem('rawat_kendaraan_cache');
    if (cached) {
      try {
        R = JSON.parse(cached);
        if (typeof norm === 'function') norm();
        if (typeof draw === 'function') draw();
      } catch(e) {
        console.error("Gagal parse cache:", e);
      }
    }

    // 2. Tarik data terbaru dari server Google Sheet
    fetch(SCRIPT_URL + "?action=getState")
      .then(res => res.json())
      .then(data => {
        if (data && data.vehicles) {
          R = data;
          localStorage.setItem('rawat_kendaraan_cache', JSON.stringify(R));
          if (typeof norm === 'function') norm();
          if (typeof draw === 'function') draw();
        }
      })
      .catch(err => {
        console.error("Gagal ambil data dari server:", err);
      });
  }

  // Fungsi Simpan Data
  function saveData() {
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "save", payload: R })
    }).catch(err => {
      console.error("Gagal menyimpan data:", err);
    });
  }

  // Panggil loadData saat halaman pertama kali dibuka
  window.onload = function() {
    if (typeof loadData === 'function') loadData();
  };
</script>
