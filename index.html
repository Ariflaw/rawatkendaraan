<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rawat Kendaraan</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --text: #172b4d;
      --text-sub: #5e6c84;
      --primary: #0052cc;
      --primary-dark: #0747a6;
      --border: #dfe1e6;
      --shadow: 0 4px 12px rgba(9,30,66,0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
    .header { background: var(--card-bg); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .subtitle { font-size: 0.85rem; color: var(--text-sub); }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; background: #ebecf0; color: #42526e; }
    .badge-mobil { background: #deebff; color: #0747a6; }
    .badge-motor { background: #e3fcef; color: #006644; }
    .km-display { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin: 12px 0 4px; }
    .comp-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .comp-item:last-child { border-bottom: none; }
    .comp-name { font-weight: 600; font-size: 0.95rem; }
    .comp-status { font-size: 0.8rem; color: var(--text-sub); text-align: right; }
    .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn:active { background: var(--primary-dark); }
    .btn-secondary { background: #ebecf0; color: #42526e; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { border: none; background: none; color: var(--text-sub); font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item.active { color: var(--primary); }
    .loader { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 0.9rem; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--text-sub); }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="app-title">Rawat Kendaraan</h1>
    <span id="sync-status" class="badge">Offline Mode</span>
  </div>

  <div class="container" id="app">
    <div class="loader">Memuat data kendaraan...</div>
  </div>

  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home')">🏠<br>Beranda</button>
    <button class="nav-item" onclick="switchTab('comps')">⚙️<br>Komponen</button>
    <button class="nav-item" onclick="switchTab('hist')">📋<br>Riwayat</button>
    <button class="nav-item" onclick="switchTab('settings')">⚙️<br>Pengaturan</button>
  </div>

  <script>
    let SCRIPT_URL = localStorage.getItem('script_url') || "https://script.google.com/macros/s/AKfycbz1bRI2snyA3PGc0r2I64X6gx60Gvme-6sdnw18YLNl4fGTHABlWm91xZYLrYir5lLw/exec";
    let R = { vehicles: [] };
    let activeVehIdx = 0;
    let currentTab = 'home';

    function norm() {
      if (!R || !R.vehicles || !Array.isArray(R.vehicles)) R = { vehicles: [] };
    }

    function draw() {
      norm();
      const app = document.getElementById('app');
      
      if (currentTab === 'settings') {
        drawSettings(app);
        return;
      }

      if (R.vehicles.length === 0) {
        app.innerHTML = `
          <div class="card" style="text-align: center; padding: 32px 16px;">
            <h3>Belum Ada Kendaraan</h3>
            <p class="subtitle" style="margin-top: 8px;">Silakan periksa pengaturan URL Web App atau tambahkan kendaraan dari Google Sheet.</p>
            <button class="btn" style="margin-top: 16px;" onclick="switchTab('settings')">Buka Pengaturan API</button>
          </div>
        `;
        return;
      }

      const v = R.vehicles[activeVehIdx] || R.vehicles[0];

      if (currentTab === 'home') {
        let html = `
          <div class="card">
            <div class="card-title">
              <span>${v.motor || 'Kendaraan Saya'}</span>
              <span class="badge badge-${v.jenis}">${v.jenis.toUpperCase()}</span>
            </div>
            <div class="subtitle">Odometer Saat Ini</div>
            <div class="km-display">${(v.km || 0).toLocaleString('id-ID')} <span style="font-size:1rem;">km</span></div>
            <div class="subtitle">Diperbarui: ${v.kmTgl || '-'}</div>
          </div>

          <div class="card">
            <div class="card-title">Komponen Perlu Perhatian</div>
        `;

        const urgentComps = (v.comps || []).filter(c => {
          const limit = c.mode === 'c' ? (c.c || 0) : (c.f || 0);
          const used = (v.km || 0) - (c.last || 0);
          return limit > 0 && used >= limit;
        });

        if (urgentComps.length === 0) {
          html += `<div class="subtitle" style="padding: 12px 0;">Semua komponen dalam kondisi aman 👍</div>`;
        } else {
          urgentComps.forEach(c => {
            const limit = c.mode === 'c' ? c.c : c.f;
            const used = (v.km || 0) - c.last;
            html += `
              <div class="comp-item">
                <div>
                  <div class="comp-name">${c.name}</div>
                  <div class="subtitle">${c.brand || 'Standar'}</div>
                </div>
                <div class="comp-status" style="color: #de350b; font-weight:700;">
                  Lewat ${(used - limit).toLocaleString('id-ID')} km
                </div>
              </div>
            `;
          });
        }
        html += `</div>`;
        app.innerHTML = html;

      } else if (currentTab === 'comps') {
        let html = `<div class="card"><div class="card-title">Daftar Komponen (${(v.comps || []).length})</div>`;
        (v.comps || []).forEach(c => {
          const limit = c.mode === 'c' ? c.c : c.f;
          const used = (v.km || 0) - c.last;
          html += `
            <div class="comp-item">
              <div>
                <div class="comp-name">${c.name}</div>
                <div class="subtitle">Merek: ${c.brand || '-'} | Interval: ${limit.toLocaleString('id-ID')} km</div>
              </div>
              <div class="comp-status">
                ${used.toLocaleString('id-ID')} / ${limit.toLocaleString('id-ID')} km
              </div>
            </div>
          `;
        });
        html += `</div>`;
        app.innerHTML = html;

      } else if (currentTab === 'hist') {
        let html = `<div class="card"><div class="card-title">Riwayat Service</div>`;
        if (!(v.hist || []).length) {
          html += `<div class="subtitle" style="padding: 12px 0;">Belum ada catatan riwayat.</div>`;
        } else {
          (v.hist || []).forEach(h => {
            html += `
              <div class="comp-item">
                <div>
                  <div class="comp-name">${h.comp}</div>
                  <div class="subtitle">${h.date} | ${h.shop || 'Bengkel'}</div>
                </div>
                <div class="comp-status" style="font-weight:600;">
                  Rp ${(h.price || 0).toLocaleString('id-ID')}
                </div>
              </div>
            `;
          });
        }
        html += `</div>`;
        app.innerHTML = html;
      }
    }

    function drawSettings(app) {
      app.innerHTML = `
        <div class="card">
          <div class="card-title">Pengaturan API Google Sheet</div>
          <p class="subtitle" style="margin-bottom: 12px;">Masukkan Web App URL Apps Script Anda di sini untuk menghubungkan database pribadi Anda.</p>
          <div class="input-group">
            <label>Web App API URL</label>
            <input type="text" id="api-url-input" value="${SCRIPT_URL}">
          </div>
          <button class="btn" onclick="saveSettings()">Simpan & Hubungkan</button>
        </div>
      `;
    }

    function saveSettings() {
      const val = document.getElementById('api-url-input').value.trim();
      if (val) {
        SCRIPT_URL = val;
        localStorage.setItem('script_url', val);
        alert('URL API Berhasil disimpan!');
        currentTab = 'home';
        loadData();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      draw();
    }

    function loadData() {
      document.getElementById('sync-status').textContent = "Syncing...";
      document.getElementById('sync-status').style.background = "#fff0b3";

      // 1. Tampilkan Cache
      const cached = localStorage.getItem('rawat_kendaraan_cache');
      if (cached) {
        try {
          R = JSON.parse(cached);
          draw();
        } catch(e) {}
      }

      // 2. Fetch Server
      fetch(SCRIPT_URL + "?action=getState")
        .then(res => res.json())
        .then(data => {
          if (data && data.vehicles) {
            R = data;
            localStorage.setItem('rawat_kendaraan_cache', JSON.stringify(R));
            document.getElementById('sync-status').textContent = "Online";
            document.getElementById('sync-status').style.background = "#e3fcef";
            draw();
          }
        })
        .catch(err => {
          console.error("Gagal koneksi:", err);
          document.getElementById('sync-status').textContent = "Offline/Cache";
          document.getElementById('sync-status').style.background = "#ffebe6";
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
    });
  </script>
</body>
</html>
